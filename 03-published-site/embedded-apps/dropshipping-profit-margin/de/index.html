<style>
    html,body{margin:0 !important;padding:0 !important;}
.copyfy-dpm * {

        margin: 0;
        padding: 0;
    }

        color: #FFFFFF !important;
        background: transparent !important;
        padding: 0 !important;
        max-width: none !important;
        padding-bottom: 100px !important;

        line-height: 1.5;
    }

    /* Bottom bar */

        align-items: center;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: wrap;
    }

    @media (max-width: 479px) {
        .copyfy-dpm-bottombar {
            flex-direction: column;
            align-items: stretch;
        }
        .copyfy-dpm-bottombar .copyfy-dpm-btn {
            justify-content: center;
        }
    }

    .copyfy-dpm-btn {
        display: inline-flex;

        gap: 8px;
        padding: 12px 24px !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        border-radius: 30px !important;
        border: none !important;
        cursor: pointer;
        font-family: inherit !important;
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none !important;
    }

    .copyfy-dpm-btn-primary {
        background: #FFFFFF !important;
        color: #0F0F10 !important;
    }

    .copyfy-dpm-btn-secondary {
        background: #0A6CFB !important;
        color: #FFFFFF !important;
    }

    .copyfy-dpm-btn:hover {

    }

    /* Main horizontal layout */
    .copyfy-dpm-layout {

    }

    .copyfy-dpm-field { position: relative; }

    .copyfy-dpm-label {

        font-weight: 600;

        width: 100% !important;

<script>
(function() {
    'use strict';

    const STORAGE_KEY = 'copyfy-dpm-de-state';

    const DEFAULTS = {
        sellingPrice: 0,
        productCost: 0,
        adCost: 0,
        shippingCost: 0,
        transactionFees: 0,
        platformFees: 0,
        returnRate: 0,
        monthlyVolume: 0
    };

    // Industry benchmark thresholds for net margin %
    // Source: Harvest dropshipping guide states 10-30% is typical range.
    const BENCHMARKS = [
        { max: 0,        label: 'Verlust',   cls: 'copyfy-dpm-badge-loss' },
        { max: 10,       label: 'Niedrig',   cls: 'copyfy-dpm-badge-low' },
        { max: 30,       label: 'Gesund',    cls: 'copyfy-dpm-badge-good' },
        { max: Infinity, label: 'Exzellent', cls: 'copyfy-dpm-badge-great' }
    ];

    // Target margin used for the "recommended selling price" helper
    const TARGET_MARGIN_PCT = 30;

    const state = Object.assign({}, DEFAULTS);

    const FIELDS = {
        'copyfy-dpm-selling-price':    ['sellingPrice',    v => parseFloat(v) || 0],
        'copyfy-dpm-product-cost':     ['productCost',     v => parseFloat(v) || 0],
        'copyfy-dpm-ad-cost':          ['adCost',          v => parseFloat(v) || 0],
        'copyfy-dpm-shipping-cost':    ['shippingCost',    v => parseFloat(v) || 0],
        'copyfy-dpm-transaction-fees': ['transactionFees', v => parseFloat(v) || 0],
        'copyfy-dpm-platform-fees':    ['platformFees',    v => parseFloat(v) || 0],
        'copyfy-dpm-return-rate':      ['returnRate',      v => parseFloat(v) || 0],
        'copyfy-dpm-monthly-volume':   ['monthlyVolume',   v => parseInt(v, 10) || 0]
    };

    function loadState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) Object.assign(state, JSON.parse(saved));
        } catch (e) { /* ignore */ }
    }

    function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    /**
     * Net profit per order =
     *   sellingPrice
     *   - productCost
     *   - shippingCost
     *   - sellingPrice * (transactionFees + platformFees + returnRate) / 100
     *   - adCostPerOrder
     */
    function compute() {
        const { sellingPrice, productCost, adCost, shippingCost,
                transactionFees, platformFees, returnRate, monthlyVolume } = state;

        if (sellingPrice <= 0) return null;

        const pctFees = (transactionFees + platformFees + returnRate) / 100;
        const variableCost = sellingPrice * pctFees;

        const grossMargin = sellingPrice - productCost - shippingCost - variableCost;
        const netProfit = grossMargin - adCost;
        const netMarginPct = (netProfit / sellingPrice) * 100;
        const monthlyProfit = netProfit * monthlyVolume;
        const beroas = grossMargin > 0 ? sellingPrice / grossMargin : null;
        const markup = productCost > 0 ? sellingPrice / productCost : null;

        // Reverse: find sellingPrice such that netMarginPct === TARGET_MARGIN_PCT
        // sellingPrice * (1 - pctFees - target/100) = productCost + shippingCost + adCost
        const denominator = 1 - pctFees - TARGET_MARGIN_PCT / 100;
        const fixedCosts = productCost + shippingCost + adCost;
        const targetPrice = denominator > 0 ? fixedCosts / denominator : null;

        return { grossMargin, netProfit, netMarginPct, monthlyProfit, beroas, markup, targetPrice };
    }

    function formatCurrency(value) {
        if (value === null || !isFinite(value)) return '—';
        return new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR',
            minimumFractionDigits: 2, maximumFractionDigits: 2
        }).format(value);
    }

    function formatCurrencyCompact(value) {
        if (value === null || !isFinite(value)) return '—';
        return new Intl.NumberFormat('de-DE', {
            style: 'currency', currency: 'EUR',
            minimumFractionDigits: 0, maximumFractionDigits: 0
        }).format(value);
    }

    function formatPct(value) {
        if (value === null || !isFinite(value)) return '—';
        return value.toFixed(1) + '%';
    }

    function formatMultiplier(value) {
        if (value === null || !isFinite(value)) return '—';
        return value.toFixed(1) + 'x';
    }

    function setTone(id, isPositive, posClass, negClass) {
        const el = document.getElementById(id);
        el.classList.remove(posClass, negClass);
        if (isPositive === true) el.classList.add(posClass);
        else if (isPositive === false) el.classList.add(negClass);
    }

    function getBenchmark(netMarginPct) {
        if (netMarginPct === null || !isFinite(netMarginPct)) {
            return { label: '—', cls: 'copyfy-dpm-badge-low' };
        }
        return BENCHMARKS.find(b => netMarginPct < b.max) || BENCHMARKS[BENCHMARKS.length - 1];
    }

    function applyBenchmark(r) {
        const badge = document.getElementById('copyfy-dpm-badge');
        const text = document.getElementById('copyfy-dpm-badge-text');
        const b = getBenchmark(r ? r.netMarginPct : null);

        ['copyfy-dpm-badge-loss', 'copyfy-dpm-badge-low',
         'copyfy-dpm-badge-good', 'copyfy-dpm-badge-great']
            .forEach(c => badge.classList.remove(c));
        badge.classList.add(b.cls);
        text.textContent = b.label;
    }

    function updateResult() {
        const r = compute();

        if (!r) {
            ['copyfy-dpm-hero-value', 'copyfy-dpm-stat-profit', 'copyfy-dpm-stat-margin',
             'copyfy-dpm-stat-markup', 'copyfy-dpm-stat-beroas']
                .forEach(id => document.getElementById(id).textContent = '—');
            document.getElementById('copyfy-dpm-hero-sub').textContent = '—';
            document.getElementById('copyfy-dpm-target-text').textContent = 'Gib einen gültigen Verkaufspreis ein.';
            document.getElementById('copyfy-dpm-interp-text').textContent = 'Gib einen gültigen Verkaufspreis ein.';
            applyBenchmark(null);
            saveState();
            return;
        }

        // Hero
        document.getElementById('copyfy-dpm-hero-value').textContent = formatCurrencyCompact(r.monthlyProfit);
        document.getElementById('copyfy-dpm-hero-sub').textContent =
            `${state.monthlyVolume} Bestellungen × ${formatCurrency(r.netProfit)} Nettogewinn`;
        setTone('copyfy-dpm-hero-value', r.monthlyProfit > 0,
                'copyfy-dpm-hero-value-positive', 'copyfy-dpm-hero-value-negative');

        // Sub-stats
        document.getElementById('copyfy-dpm-stat-profit').textContent = formatCurrency(r.netProfit);
        document.getElementById('copyfy-dpm-stat-margin').textContent = formatPct(r.netMarginPct);
        document.getElementById('copyfy-dpm-stat-markup').textContent = formatMultiplier(r.markup);
        document.getElementById('copyfy-dpm-stat-beroas').textContent =
            r.beroas !== null ? r.beroas.toFixed(2) : '∞';

        setTone('copyfy-dpm-stat-profit', r.netProfit > 0,
                'copyfy-dpm-stat-value-positive', 'copyfy-dpm-stat-value-negative');
        setTone('copyfy-dpm-stat-margin', r.netMarginPct > 0,
                'copyfy-dpm-stat-value-positive', 'copyfy-dpm-stat-value-negative');

        // Benchmark
        applyBenchmark(r);

        // Target price helper
        const targetText = document.getElementById('copyfy-dpm-target-text');
        if (r.targetPrice !== null && isFinite(r.targetPrice)) {
            const delta = r.targetPrice - state.sellingPrice;
            const direction = delta > 0.5 ? 'erhöhe deinen Preis auf' : delta < -0.5 ? 'senke deinen Preis auf' : 'bleibe nahe bei';
            targetText.innerHTML = `Um <strong>${TARGET_MARGIN_PCT}% Nettomarge</strong> anzustreben (oberer Branchendurchschnitt), ${direction} <strong>${formatCurrency(r.targetPrice)}</strong>.`;
        } else {
            targetText.innerHTML = `Es ist unmöglich, <strong>${TARGET_MARGIN_PCT}% Marge</strong> mit diesen variablen Kosten zu erreichen — reduziere die Rückgaberate oder die Plattformgebühren.`;
        }

        // Interpretation
        const interp = document.getElementById('copyfy-dpm-interp');
        const interpText = document.getElementById('copyfy-dpm-interp-text');
        interp.classList.remove('copyfy-dpm-interp-loss');

        if (r.netProfit > 0) {
            const markupTxt = r.markup !== null ? ` Dein Markup beträgt <strong>${formatMultiplier(r.markup)}</strong> (Dropshipping-Regel: mindestens 3x anstreben).` : '';
            interpText.innerHTML = `Du verdienst <strong>${formatCurrency(r.netProfit)}</strong> pro Bestellung (Nettomarge <strong>${formatPct(r.netMarginPct)}</strong>). Dein Werbe-ROAS muss <strong>${r.beroas !== null ? r.beroas.toFixed(2) : '∞'}</strong> übersteigen, um profitabel zu bleiben.${markupTxt}`;
        } else {
            interp.classList.add('copyfy-dpm-interp-loss');
            interpText.innerHTML = `Du verlierst <strong>${formatCurrency(Math.abs(r.netProfit))}</strong> pro Bestellung. Maximal akzeptable Werbekosten: <strong>${formatCurrency(Math.max(0, r.grossMargin))}</strong>. Erhöhe den Preis oder finde einen günstigeren Lieferanten.`;
        }

        saveState();
    }

    function init() {
        /* loadState disabled: default 0 */

        Object.entries(FIELDS).forEach(([id, [key, parser]]) => {
            const el = document.getElementById(id);
            el.value = state[key];
            el.addEventListener('input', (e) => {
                state[key] = parser(e.target.value);
                updateResult();
            });
        });

        document.getElementById('copyfy-dpm-reset').addEventListener('click', () => {
            Object.assign(state, DEFAULTS);
            Object.entries(FIELDS).forEach(([id, [key]]) => {
                document.getElementById(id).value = state[key];
            });
            updateResult();
        });

        updateResult();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<script>
(function(){
  function ph(){ try{ parent.postMessage({copyfyToolHeight: Math.ceil((document.querySelector(".copyfy-beroas,.copyfy-dpm")||document.body).getBoundingClientRect().bottom)}, "*"); }catch(e){} }
  window.addEventListener("load", ph);
  window.addEventListener("resize", ph);
  document.addEventListener("input", ph, true);
  if(window.ResizeObserver){ new ResizeObserver(ph).observe(document.documentElement); }
  setTimeout(ph,200); setTimeout(ph,800);
})();
</script>
