<style>
    html,body{margin:0 !important;padding:0 !important;}
    .copyfy-ttdl *{box-sizing:border-box !important;margin:0;padding:0;}
    .copyfy-ttdl{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif !important;
        color:#FFFFFF !important;background:transparent !important;
        padding:0 !important;padding-bottom:100px !important;max-width:none !important;width:100% !important;margin:0 auto !important;
        overflow:hidden !important;line-height:1.5;
    }
    .copyfy-ttdl-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;}
    .copyfy-ttdl-field{position:relative;flex:1 1 320px;min-width:0;}
    .copyfy-ttdl-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#0F0F10;font-size:15px;pointer-events:none;}
    .copyfy-ttdl-input{
        width:100% !important;background:#FFFFFF !important;color:#0F0F10 !important;
        border:1px solid #FFFFFF !important;border-radius:12px !important;
        padding:14px 14px 14px 34px !important;font-size:15px !important;font-family:inherit !important;
        transition:border-color .2s ease;
    }
    .copyfy-ttdl-input::placeholder{color:#8a8a8a;}
    .copyfy-ttdl-input:hover{border-color:#d1d5db !important;}
    .copyfy-ttdl-input:focus{outline:none;background:#FFFFFF !important;color:#0F0F10 !important;border-color:#6B7280 !important;}
    .copyfy-ttdl-btn{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        border:none !important;border-radius:30px !important;padding:12px 24px !important;
        font-size:14px !important;font-weight:700 !important;font-family:inherit !important;
        cursor:pointer;text-decoration:none;background:#0A6CFB !important;color:#FFFFFF !important;
        transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease;
    }
    .copyfy-ttdl-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.25);}
    .copyfy-ttdl-btn[disabled]{opacity:.6;cursor:default;transform:none;box-shadow:none;}
    .copyfy-ttdl-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;border-radius:50%;animation:copyfy-ttdl-rot .7s linear infinite;flex:0 0 auto;}
    @keyframes copyfy-ttdl-rot{to{transform:rotate(360deg);}}
    .copyfy-ttdl-hint{margin-top:10px;font-size:13px;color:#B8BCC6;}
    .copyfy-ttdl-hint a{color:#FFFFFF;font-weight:600;}
    .copyfy-ttdl-results{margin-top:16px;}
    .copyfy-ttdl-card{background:#FFFFFF !important;border-radius:12px;padding:24px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;color:#0F0F10;}
    .copyfy-ttdl-media{flex:0 0 240px;max-width:100%;}
    .copyfy-ttdl-video{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#0F0F10;border-radius:10px;}
    .copyfy-ttdl-info{flex:1 1 300px;min-width:0;}
    .copyfy-ttdl-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;}
    .copyfy-ttdl-title{font-size:15px;font-weight:600;color:#0F0F10;margin:6px 0 8px;white-space:pre-line;word-break:break-word;max-height:7.5em;overflow:auto;}
    .copyfy-ttdl-copy{background:none;border:none;color:#0A6CFB;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;padding:0;}
    .copyfy-ttdl-rows{margin-top:12px;}
    .copyfy-ttdl-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid #EDEEF1;}
    .copyfy-ttdl-row:last-child{border-bottom:none;}
    .copyfy-ttdl-row-k{font-size:13px;color:#6B7280;font-weight:600;flex:0 0 auto;}
    .copyfy-ttdl-row-v{font-size:14px;color:#0F0F10;font-weight:600;text-align:right;word-break:break-word;min-width:0;}
    .copyfy-ttdl-row-v a{color:#0A6CFB;}
    .copyfy-ttdl-dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
    .copyfy-ttdl-dl .copyfy-ttdl-btn{border-radius:10px !important;padding:12px 18px !important;font-size:13px !important;}
    .copyfy-ttdl-dl .copyfy-ttdl-btn.is-alt{background:#FFFFFF !important;color:#0F0F10 !important;border:1px solid #D1D5DB !important;}
    .copyfy-ttdl-dl .copyfy-ttdl-btn.is-alt .copyfy-ttdl-spin{border-color:rgba(15,15,16,.2);border-top-color:#0F0F10;}
    .copyfy-ttdl-note{font-size:12px;color:#6B7280;margin-top:10px;}
    .copyfy-ttdl-msg{background:#FFFFFF !important;border-radius:12px;padding:16px 20px;font-size:14px;color:#0F0F10;border-left:4px solid #DC2626;}
    .copyfy-ttdl-msg a{color:#0A6CFB;font-weight:600;}
    @media (max-width:560px){
        .copyfy-ttdl-card{padding:16px;}
        .copyfy-ttdl-media{flex:1 1 100%;max-width:260px;margin:0 auto;}
        .copyfy-ttdl-row{flex-direction:column;gap:2px;}.copyfy-ttdl-row-v{text-align:left;}
        .copyfy-ttdl-dl .copyfy-ttdl-btn{flex:1 1 100%;}
        .copyfy-ttdl-dl .copyfy-ttdl-btn.is-alt{flex:1 1 0;padding:12px 6px !important;}
    }
</style>

<div class="copyfy-ttdl">
    <div class="copyfy-ttdl-bar">
        <div class="copyfy-ttdl-field">
            <input type="text" id="copyfy-ttdl-url" class="copyfy-ttdl-input" autocomplete="off" spellcheck="false">
            <span class="copyfy-ttdl-icon">&#128269;</span>
        </div>
        <button type="button" id="copyfy-ttdl-run" class="copyfy-ttdl-btn"></button>
    </div>
    <p class="copyfy-ttdl-hint" id="copyfy-ttdl-hint"></p>
    <div class="copyfy-ttdl-results" id="copyfy-ttdl-results" hidden></div>
</div>

<script>
(function(){
    'use strict';

    var LOCALE = 'es';
    var T = {
        "placeholder": "Enlace de un anuncio de TikTok Creative Center",
        "run": "Obtener el vídeo",
        "loading": "Buscando…",
        "hint": "Pega el enlace de un anuncio abierto desde el {link} (pestaña Top Ads), o su identificador de 19 cifras.",
        "hintLink": "TikTok Creative Center",
        "caption": "Texto del anuncio",
        "noCaption": "Este anuncio no tiene texto publicitario.",
        "copy": "Copiar el texto",
        "copied": "Texto copiado",
        "rowObjective": "Objetivo de campaña",
        "rowDuration": "Duración",
        "rowFormat": "Formato",
        "rowCountries": "Países de difusión",
        "rowLanding": "Página de destino",
        "rowSource": "Fuente",
        "sourceLink": "Ver en Creative Center",
        "dlBest": "Descargar en {q} (MP4)",
        "dlOther": "{q}",
        "dlProgress": "Descargando… {p} %",
        "dlStarting": "Descargando…",
        "note": "Los enlaces de vídeo están firmados por TikTok y caducan al cabo de unas horas: vuelve a buscar si una descarga falla.",
        "errInvalid": "No reconocemos este enlace. Pega la URL de un anuncio de TikTok Creative Center (…/creativecenter/topads/…) o su identificador.",
        "errAdLibrary": "La TikTok Ad Library (UE) protege sus vídeos con una verificación antibots, así que no se pueden obtener. Busca el mismo anuncio en el {link} y pega ese enlace.",
        "errTikTokVideo": "Los vídeos de tiktok.com no son compatibles: la herramienta obtiene anuncios del {link}. Pega el enlace de un anuncio de Top Ads.",
        "errNotFound": "No se ha encontrado ningún anuncio con este enlace. Puede que lo hayan retirado del Creative Center.",
        "errFetch": "TikTok no ha respondido. Vuelve a intentarlo en unos segundos.",
        "objectives": {
            "product_sales": "Ventas de productos",
            "video_view": "Visualizaciones de vídeo",
            "lead_generation": "Generación de clientes potenciales",
            "traffic": "Tráfico",
            "conversions": "Conversiones",
            "web_conversions": "Conversiones",
            "reach": "Alcance",
            "app_install": "Instalaciones de app",
            "app_promotion": "Promoción de app",
            "community_interaction": "Interacciones",
            "engagement": "Interacciones"
        }
    };
    var CC_URL = 'https://ads.tiktok.com/business/creativecenter/inspiration/topads/pc/' + LOCALE;

    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    function postHeight(){
        try { parent.postMessage({copyfyToolHeight: Math.ceil((document.querySelector('.copyfy-ttdl')||document.body).getBoundingClientRect().bottom)}, '*'); } catch(e){}
    }

    // Fill a "{link}" placeholder with a real anchor to the Creative Center Top Ads.
    function withLink(node, text){
        var parts = text.split('{link}');
        node.textContent = parts[0];
        if (parts.length > 1){
            var a = el('a', null, T.hintLink);
            a.href = CC_URL; a.target = '_blank'; a.rel = 'noopener nofollow';
            node.appendChild(a);
            node.appendChild(document.createTextNode(parts[1]));
        }
        return node;
    }

    function fmtDuration(s){
        if (typeof s !== 'number') return null;
        var t = Math.round(s);
        return t < 60 ? t + ' s' : Math.floor(t / 60) + ' min ' + (t % 60) + ' s';
    }

    function fmtFormat(w, h){
        if (!w || !h) return null;
        var r = w / h, ratio = Math.abs(r - 9/16) < .02 ? '9:16' : Math.abs(r - 1) < .02 ? '1:1' : Math.abs(r - 16/9) < .02 ? '16:9' : null;
        return w + ' × ' + h + (ratio ? ' (' + ratio + ')' : '');
    }

    function fmtCountries(list){
        if (!list || !list.length) return null;
        var dn = null;
        try { dn = new Intl.DisplayNames([LOCALE], {type: 'region'}); } catch(e){}
        return list.map(function(c){ try { return dn ? dn.of(c) : c; } catch(e){ return c; } }).join(', ');
    }

    function row(k, v){
        if (v === null || v === undefined || v === '') return null;
        var r = el('div', 'copyfy-ttdl-row');
        r.appendChild(el('div', 'copyfy-ttdl-row-k', k));
        var vEl = el('div', 'copyfy-ttdl-row-v');
        if (v.nodeType) vEl.appendChild(v); else vEl.textContent = v;
        r.appendChild(vEl);
        return r;
    }

    function extLink(href, text){
        var a = el('a', null, text);
        a.href = href; a.target = '_blank'; a.rel = 'noopener nofollow';
        return a;
    }

    function download(btn, video, adId){
        var label = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '';
        btn.appendChild(el('span', 'copyfy-ttdl-spin'));
        var txt = el('span', null, T.dlStarting);
        btn.appendChild(txt);
        function done(){ btn.disabled = false; btn.textContent = label; }
        // The TikTok CDN answers with CORS *, so the MP4 is fetched as a blob and
        // saved under a clean file name. Fallback: open the signed URL in a new tab.
        fetch(video.url).then(function(r){
            if (!r.ok) throw new Error('http ' + r.status);
            var total = +r.headers.get('content-length') || 0;
            if (!r.body || !r.body.getReader || !total) return r.blob();
            var reader = r.body.getReader(), got = 0, chunks = [];
            function pump(){
                return reader.read().then(function(res){
                    if (res.done) return new Blob(chunks, {type: 'video/mp4'});
                    chunks.push(res.value); got += res.value.length;
                    txt.textContent = T.dlProgress.replace('{p}', Math.min(99, Math.round(got / total * 100)));
                    return pump();
                });
            }
            return pump();
        }).then(function(blob){
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tiktok-ad-' + adId + '-' + video.quality + '.mp4';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
            done();
        }).catch(function(){
            window.open(video.url, '_blank', 'noopener');
            done();
        });
    }

    function renderAd(ad){
        var host = $('copyfy-ttdl-results');
        var card = el('div', 'copyfy-ttdl-card');

        var media = el('div', 'copyfy-ttdl-media');
        var v = document.createElement('video');
        v.className = 'copyfy-ttdl-video';
        v.controls = true; v.playsInline = true; v.preload = 'metadata';
        if (ad.cover) v.poster = ad.cover;
        v.src = ad.videos[ad.videos.length > 1 ? 1 : 0].url;
        v.addEventListener('loadedmetadata', postHeight);
        media.appendChild(v);
        card.appendChild(media);

        var info = el('div', 'copyfy-ttdl-info');
        info.appendChild(el('div', 'copyfy-ttdl-label', T.caption));
        info.appendChild(el('div', 'copyfy-ttdl-title', ad.title || T.noCaption));
        if (ad.title && navigator.clipboard){
            var cp = el('button', 'copyfy-ttdl-copy', T.copy);
            cp.type = 'button';
            cp.addEventListener('click', function(){
                navigator.clipboard.writeText(ad.title).then(function(){
                    cp.textContent = T.copied;
                    setTimeout(function(){ cp.textContent = T.copy; }, 1800);
                }).catch(function(){});
            });
            info.appendChild(cp);
        }

        var rows = el('div', 'copyfy-ttdl-rows');
        [
            row(T.rowObjective, ad.objective ? (T.objectives[ad.objective] || ad.objective.replace(/_/g, ' ')) : null),
            row(T.rowDuration, fmtDuration(ad.duration)),
            row(T.rowFormat, fmtFormat(ad.width, ad.height)),
            row(T.rowCountries, fmtCountries(ad.countries)),
            row(T.rowLanding, ad.landingPage ? extLink(ad.landingPage, ad.landingPage.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')) : null),
            row(T.rowSource, extLink(ad.sourceUrl, T.sourceLink))
        ].forEach(function(r){ if (r) rows.appendChild(r); });
        info.appendChild(rows);

        var dl = el('div', 'copyfy-ttdl-dl');
        ad.videos.forEach(function(video, i){
            var b = el('button', 'copyfy-ttdl-btn' + (i ? ' is-alt' : ''), (i ? T.dlOther : T.dlBest).replace('{q}', video.quality));
            b.type = 'button';
            b.addEventListener('click', function(){ download(b, video, ad.id); });
            dl.appendChild(b);
        });
        info.appendChild(dl);
        info.appendChild(el('p', 'copyfy-ttdl-note', T.note));

        card.appendChild(info);
        host.appendChild(card);
    }

    function renderError(data){
        var msg = el('div', 'copyfy-ttdl-msg');
        var text = data.error === 'invalid_url' ? T.errInvalid
            : data.error === 'unsupported_source' ? (data.source === 'ad_library' ? T.errAdLibrary : T.errTikTokVideo)
            : data.error === 'not_found' ? T.errNotFound
            : T.errFetch;
        withLink(msg, text);
        $('copyfy-ttdl-results').appendChild(msg);
    }

    function render(data){
        var host = $('copyfy-ttdl-results');
        host.innerHTML = '';
        host.hidden = false;
        if (data && data.ad) renderAd(data.ad); else renderError(data || {});
        postHeight();
    }

    function run(){
        var url = $('copyfy-ttdl-url').value.trim();
        if (!url) return;
        var btn = $('copyfy-ttdl-run');
        btn.disabled = true;
        btn.innerHTML = '';
        btn.appendChild(el('span', 'copyfy-ttdl-spin'));
        btn.appendChild(el('span', null, T.loading));
        fetch('/api/tiktok-ad?url=' + encodeURIComponent(url))
            .then(function(r){ return r.json(); })
            .then(render)
            .catch(function(){ render({error: 'fetch_failed'}); })
            .then(function(){ btn.disabled = false; btn.textContent = T.run; });
    }

    function init(){
        $('copyfy-ttdl-url').placeholder = T.placeholder;
        $('copyfy-ttdl-run').textContent = T.run;
        withLink($('copyfy-ttdl-hint'), T.hint);
        $('copyfy-ttdl-run').addEventListener('click', run);
        $('copyfy-ttdl-url').addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });
        postHeight();
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
})();
</script>

<script>
(function(){
    function ph(){ try{ parent.postMessage({copyfyToolHeight: Math.ceil((document.querySelector('.copyfy-ttdl')||document.body).getBoundingClientRect().bottom)}, '*'); }catch(e){} }
    window.addEventListener('load', ph);
    window.addEventListener('resize', ph);
    document.addEventListener('input', ph, true);
    document.addEventListener('click', ph, true);
    if (window.ResizeObserver){ new ResizeObserver(ph).observe(document.documentElement); }
    setTimeout(ph,200); setTimeout(ph,800);
})();
</script>
