            "copySource": "Berechnet auf"
    };
    var MODE_LABELS = {"period":"Pro Zeitraum","order":"Pro Bestellung"};
    var STAT_LABELS = {"period":["Rohertrag","Nettogewinn","ROAS","Nettomarge"],"order":["Nettogewinn","ROAS","Nettomarge","Max. CPA"]};

    var DEFAULTS = {
        period: { revenue: 0, cogs: 0, adSpend: 0, platformFees: 0, shipping: 0, otherCosts: 0 },
        order:  { adSpend: 0, fixedCosts: 0, orders: 0, aov: 0, productCost: 0, shippingCost: 0, variableFees: 0, returnRate: 0 }
    };

    // Paliers du badge, ROI mesuré sur le capital réellement engagé.
    var BENCHMARKS = [
        { max: 0,        key: 'loss',  cls: 'copyfy-roi-badge-loss' },
        { max: 15,       key: 'low',   cls: 'copyfy-roi-badge-low' },
        { max: 40,       key: 'good',  cls: 'copyfy-roi-badge-good' },
        { max: Infinity, key: 'great', cls: 'copyfy-roi-badge-great' }
    ];

    var mode = 'period';
    var state = {
        period: Object.assign({}, DEFAULTS.period),
        order: Object.assign({}, DEFAULTS.order)
    };

    var num = function (v) { return parseFloat(v) || 0; };
    var int = function (v) { return parseInt(v, 10) || 0; };

    var FIELDS = {
        period: {
            "copyfy-roi-revenue": "revenue",
            "copyfy-roi-cogs": "cogs",
            "copyfy-roi-ad-spend": "adSpend",
            "copyfy-roi-platform-fees": "platformFees",
            "copyfy-roi-shipping": "shipping",
            "copyfy-roi-other-costs": "otherCosts"
    },
        order: {
            "copyfy-roi-o-ad-spend": "adSpend",
            "copyfy-roi-o-fixed-costs": "fixedCosts",
            "copyfy-roi-o-orders": "orders",
            "copyfy-roi-o-aov": "aov",
            "copyfy-roi-o-product-cost": "productCost",
            "copyfy-roi-o-shipping": "shippingCost",
            "copyfy-roi-o-variable-fees": "variableFees",
            "copyfy-roi-o-return-rate": "returnRate"
    }
    };

    function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ mode: mode, state: state })); } catch (e) {}
    }

    /**
     * Mode "par période" : ROI = (CA - coûts totaux) / coûts totaux.
     * Coûts totaux = COGS + pub + frais de plateforme + livraison + autres.
     */
    function computePeriod() {
        var s = state.period;
        if (s.revenue <= 0 || s.cogs <= 0) return null;

        var totalCosts = s.cogs + s.adSpend + s.platformFees + s.shipping + s.otherCosts;
        var grossProfit = s.revenue - s.cogs;
        var netProfit = s.revenue - totalCosts;

        return {
            base: totalCosts,
            grossProfit: grossProfit,
            netProfit: netProfit,
            roiPct: totalCosts > 0 ? (netProfit / totalCosts) * 100 : null,
            perUnit: totalCosts > 0 ? netProfit / totalCosts : null,
            roas: s.adSpend > 0 ? s.revenue / s.adSpend : null,
            marginPct: (netProfit / s.revenue) * 100,
            breakEvenRevenue: totalCosts,
            delta: Math.abs(s.revenue - totalCosts)
        };
    }

    /**
     * Mode "par commande" : unit economics.
     * Marge brute par commande = panier - coût produit - livraison - panier x (frais variables + retours).
     */
    function computeOrder() {
        var s = state.order;
        if (s.orders <= 0 || s.aov <= 0) return null;

        var pct = (s.variableFees + s.returnRate) / 100;
        var revenue = s.orders * s.aov;
        var variableCost = revenue * pct;
        var cogs = s.orders * (s.productCost + s.shippingCost);

        var grossPerOrder = s.aov - s.productCost - s.shippingCost - s.aov * pct;
        var grossProfit = grossPerOrder * s.orders;
        var totalInvest = s.adSpend + s.fixedCosts + cogs + variableCost;
        var netProfit = grossProfit - s.adSpend - s.fixedCosts;

        return {
            base: totalInvest,
            grossProfit: grossProfit,
            netProfit: netProfit,
            roiPct: totalInvest > 0 ? (netProfit / totalInvest) * 100 : null,
            perUnit: totalInvest > 0 ? netProfit / totalInvest : null,
            roas: s.adSpend > 0 ? revenue / s.adSpend : null,
            marginPct: revenue > 0 ? (netProfit / revenue) * 100 : null,
            beroas: grossPerOrder > 0 ? s.aov / grossPerOrder : null,
            cpaMax: grossPerOrder,
            cpaReal: s.adSpend / s.orders,
            breakEvenOrders: grossPerOrder > 0 ? Math.ceil((s.adSpend + s.fixedCosts) / grossPerOrder) : null
        };
    }

    function compute() { return mode === 'period' ? computePeriod() : computeOrder(); }

    function fmt(tpl, vars) {
        return tpl.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
    }

    function currency(value, digits) {
        if (value === null || !isFinite(value)) return '—';
        return new Intl.NumberFormat(INTL_LOCALE, {
            style: 'currency', currency: CURRENCY,
            minimumFractionDigits: digits, maximumFractionDigits: digits
        }).format(value);
    }

    function money(value) { return currency(value, 2); }
    function moneyCompact(value) { return currency(value, 0); }

    function pct(value) {
        if (value === null || !isFinite(value)) return '—';
        return value.toFixed(1) + '%';
    }

    function ratio(value) {
        if (value === null || !isFinite(value)) return T.na;
        return value.toFixed(2);
    }

    function nb(value) { return new Intl.NumberFormat(INTL_LOCALE).format(value); }

    function setTone(id, isPositive, posClass, negClass) {
        var el = document.getElementById(id);
        el.classList.remove(posClass, negClass);
        if (isPositive === true) el.classList.add(posClass);
        else if (isPositive === false) el.classList.add(negClass);
    }

    function statTone(i, isPositive) {
        setTone('copyfy-roi-stat-' + i, isPositive,
                'copyfy-roi-stat-value-positive', 'copyfy-roi-stat-value-negative');
    }

    function setStat(i, value) { document.getElementById('copyfy-roi-stat-' + i).textContent = value; }

    function applyBenchmark(r) {
        var badge = document.getElementById('copyfy-roi-badge');
        var text = document.getElementById('copyfy-roi-badge-text');
        var b = null;

        if (r && r.roiPct !== null && isFinite(r.roiPct)) {
            for (var i = 0; i < BENCHMARKS.length; i++) {
                if (r.roiPct < BENCHMARKS[i].max) { b = BENCHMARKS[i]; break; }
            }
            if (!b) b = BENCHMARKS[BENCHMARKS.length - 1];
        }

        ['copyfy-roi-badge-loss', 'copyfy-roi-badge-low',
         'copyfy-roi-badge-good', 'copyfy-roi-badge-great']
            .forEach(function (c) { badge.classList.remove(c); });

        badge.classList.add(b ? b.cls : 'copyfy-roi-badge-low');
        text.textContent = b ? T[b.key] : '—';
    }

    function renderStatLabels() {
        var labels = STAT_LABELS[mode];
        for (var i = 0; i < 4; i++) {
            document.getElementById('copyfy-roi-stat-label-' + (i + 1)).textContent = labels[i];
        }
    }

    function updateResult() {
        var r = compute();
        var target = document.getElementById('copyfy-roi-target');
        var targetText = document.getElementById('copyfy-roi-target-text');
        var interp = document.getElementById('copyfy-roi-interp');
        var interpText = document.getElementById('copyfy-roi-interp-text');

        target.classList.remove('copyfy-roi-target-warn');
        interp.classList.remove('copyfy-roi-interp-loss');

        if (!r) {
            document.getElementById('copyfy-roi-hero-value').textContent = '—';
            document.getElementById('copyfy-roi-hero-sub').textContent = '—';
            for (var i = 1; i <= 4; i++) { setStat(i, '—'); statTone(i, null); }
            setTone('copyfy-roi-hero-value', null,
                    'copyfy-roi-hero-value-positive', 'copyfy-roi-hero-value-negative');
            targetText.textContent = mode === 'period' ? T.emptyPeriod : T.emptyOrder;
            interpText.textContent = mode === 'period' ? T.emptyPeriod : T.emptyOrder;
            applyBenchmark(null);
            saveState();
            return;
        }

        document.getElementById('copyfy-roi-hero-value').textContent = pct(r.roiPct);
        document.getElementById('copyfy-roi-hero-sub').textContent = fmt(
            mode === 'period' ? T.heroSubPeriod : T.heroSubOrder,
            { net: money(r.netProfit), costs: moneyCompact(r.base) }
        );
        setTone('copyfy-roi-hero-value', r.roiPct !== null && r.roiPct > 0,
                'copyfy-roi-hero-value-positive', 'copyfy-roi-hero-value-negative');
        applyBenchmark(r);

        if (mode === 'period') {
            setStat(1, moneyCompact(r.grossProfit));
            setStat(2, moneyCompact(r.netProfit));
            setStat(3, ratio(r.roas));
            setStat(4, pct(r.marginPct));
            statTone(1, r.grossProfit > 0);
            statTone(2, r.netProfit > 0);
            statTone(3, r.roas !== null ? r.netProfit > 0 : null);
            statTone(4, r.marginPct > 0);

            if (r.netProfit >= 0) {
                targetText.innerHTML = fmt(T.targetPeriodAbove, { be: money(r.breakEvenRevenue), delta: money(r.delta) });
            } else {
                target.classList.add('copyfy-roi-target-warn');
                targetText.innerHTML = fmt(T.targetPeriodBelow, { be: money(r.breakEvenRevenue), delta: money(r.delta) });
            }

            if (r.netProfit > 0) {
                interpText.innerHTML = fmt(T.interpPeriodPositive, {
                    cur: T.cur, perUnit: money(r.perUnit), gross: money(r.grossProfit), roas: ratio(r.roas)
                });
            } else {
                interp.classList.add('copyfy-roi-interp-loss');
                interpText.innerHTML = fmt(T.interpPeriodNegative, {
                    loss: money(Math.abs(r.netProfit)), be: money(r.breakEvenRevenue), delta: money(r.delta)
                });
            }
        } else {
            setStat(1, moneyCompact(r.netProfit));
            setStat(2, ratio(r.roas));
            setStat(3, pct(r.marginPct));
            setStat(4, money(r.cpaMax));
            statTone(1, r.netProfit > 0);
            statTone(2, r.roas !== null && r.beroas !== null ? r.roas >= r.beroas : null);
            statTone(3, r.marginPct !== null && r.marginPct > 0);
            statTone(4, r.cpaMax > 0);

            if (r.breakEvenOrders === null) {
                target.classList.add('copyfy-roi-target-warn');
                targetText.innerHTML = T.targetOrderImpossible;
            } else if (state.order.orders >= r.breakEvenOrders) {
                targetText.innerHTML = fmt(T.targetOrderReached, {
                    be: nb(r.breakEvenOrders), orders: nb(state.order.orders)
                });
            } else {
                target.classList.add('copyfy-roi-target-warn');
                targetText.innerHTML = fmt(T.targetOrderMissing, {
                    missing: nb(r.breakEvenOrders - state.order.orders), be: nb(r.breakEvenOrders)
                });
            }

            if (r.netProfit > 0) {
                interpText.innerHTML = fmt(T.interpOrderPositive, {
                    cur: T.cur, perUnit: money(r.perUnit), roas: ratio(r.roas),
                    beroas: ratio(r.beroas), cpaReal: money(r.cpaReal), cpaMax: money(r.cpaMax)
                });
            } else {
                interp.classList.add('copyfy-roi-interp-loss');
                interpText.innerHTML = fmt(T.interpOrderNegative, {
                    loss: money(Math.abs(r.netProfit)), cpaReal: money(r.cpaReal), cpaMax: money(Math.max(0, r.cpaMax))
                });
            }
        }

        saveState();
    }

    function resultsAsText() {
        var r = compute();
        var lines = [T.copyTitle, ''];
        if (!r) {
            lines.push(mode === 'period' ? T.emptyPeriod : T.emptyOrder);
            return lines.join('\n');
        }
        lines.push(T.copyRoi + ': ' + pct(r.roiPct));
        if (mode === 'period') {
            lines.push(T.copyGross + ': ' + money(r.grossProfit));
            lines.push(T.copyNet + ': ' + money(r.netProfit));
            lines.push(T.copyRoas + ': ' + ratio(r.roas));
            lines.push(T.copyMargin + ': ' + pct(r.marginPct));
            lines.push(T.copyBe + ': ' + money(r.breakEvenRevenue));
        } else {
            lines.push(T.copyNet + ': ' + money(r.netProfit));
            lines.push(T.copyRoas + ': ' + ratio(r.roas));
            lines.push(T.copyMargin + ': ' + pct(r.marginPct));
            lines.push(T.copyBe + ': ' + (r.breakEvenOrders === null ? T.na : nb(r.breakEvenOrders)));
        }
        lines.push('');
        lines.push(T.copySource + ': ' + MODE_LABELS[mode]);
        return lines.join('\n');
    }

    function copyResults() {
        var text = resultsAsText();
        var label = document.getElementById('copyfy-roi-copy-text');

        function done() {
            label.textContent = "Kopiert";
            setTimeout(function () { label.textContent = "Ergebnisse kopieren"; }, 2000);
        }

        function fallback() {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'absolute';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                done();
            } catch (e) { /* clipboard indisponible */ }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
        } else {
            fallback();
        }
    }

    function setMode(next) {
        mode = next;
        ['period', 'order'].forEach(function (m) {
            document.getElementById('copyfy-roi-group-' + m).hidden = (m !== mode);
            document.getElementById('copyfy-roi-mode-' + m)
                .classList.toggle('copyfy-roi-mode-active', m === mode);
        });
        renderStatLabels();
        updateResult();
    }

    function bindGroup(groupMode) {
        Object.keys(FIELDS[groupMode]).forEach(function (id) {
            var key = FIELDS[groupMode][id];
            var el = document.getElementById(id);
            var parser = (key === 'orders') ? int : num;
            el.value = state[groupMode][key];
            el.addEventListener('input', function (e) {
                state[groupMode][key] = parser(e.target.value);
                updateResult();
            });
        });
    }

    function init() {
        /* pas de restauration localStorage : le tool démarre toujours à 0 */

        bindGroup('period');
        bindGroup('order');

        ['period', 'order'].forEach(function (m) {
            document.getElementById('copyfy-roi-mode-' + m)
                .addEventListener('click', function () { setMode(m); });
        });

        document.getElementById('copyfy-roi-reset').addEventListener('click', function () {
            state.period = Object.assign({}, DEFAULTS.period);
            state.order = Object.assign({}, DEFAULTS.order);
            ['period', 'order'].forEach(function (m) {
                Object.keys(FIELDS[m]).forEach(function (id) {
                    document.getElementById(id).value = state[m][FIELDS[m][id]];
                });
            });
            updateResult();
        });

        document.getElementById('copyfy-roi-copy').addEventListener('click', copyResults);

        renderStatLabels();
        updateResult();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<script>
(function(){
  function ph(){ try{ parent.postMessage({copyfyToolHeight: Math.ceil((document.querySelector(".copyfy-roi")||document.body).getBoundingClientRect().bottom)}, "*"); }catch(e){} }
  window.addEventListener("load", ph);
  window.addEventListener("resize", ph);
  document.addEventListener("input", ph, true);
  document.addEventListener("click", ph, true);
  if(window.ResizeObserver){ new ResizeObserver(ph).observe(document.documentElement); }
  setTimeout(ph,200); setTimeout(ph,800);
})();
</script>
