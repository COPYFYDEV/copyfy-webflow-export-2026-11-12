<div class="copyfy-beroas">
    <!-- Inputs -->

<script>
(function() {
    'use strict';

    const STORAGE_KEY = 'copyfy-beroas-es-state';

    const DEFAULTS = {
        sellingPrice: 45,
        productCost: 13,
        targetBeroas: 1.35,
        shippingCost: 0,
        transactionFees: 2.9,
        platformFees: 0,
        returnRate: 5
    };

    const state = Object.assign({}, DEFAULTS);

    const FIELDS = {
        'copyfy-beroas-selling-price': ['sellingPrice',    v => parseFloat(v) || 0],
        'copyfy-beroas-product-cost':  ['productCost',     v => parseFloat(v) || 0],
        'copyfy-beroas-target':        ['targetBeroas',    v => parseFloat(v) || 0],
        'copyfy-beroas-shipping':      ['shippingCost',    v => parseFloat(v) || 0],
        'copyfy-beroas-transaction':   ['transactionFees', v => parseFloat(v) || 0],
        'copyfy-beroas-platform':      ['platformFees',    v => parseFloat(v) || 0],
        'copyfy-beroas-return':        ['returnRate',      v => parseFloat(v) || 0]
    };

    function loadState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) Object.assign(state, JSON.parse(saved));
        } catch (e) { /* ignore */ }
    }

    function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    /**
     * BEROAS = sellingPrice / (sellingPrice - totalCost)
     * où totalCost = produit + livraison + frais % + retour %
     * Retourne null si la marge est négative ou nulle.
     */
    function calculateBeroas(sellingPrice, productCost) {
        if (sellingPrice <= 0 || productCost < 0) return null;

        const variableCost = sellingPrice * (state.transactionFees + state.platformFees + state.returnRate) / 100;
        const totalCost = productCost + state.shippingCost + variableCost;

        if (totalCost >= sellingPrice) return null;
        return sellingPrice / (sellingPrice - totalCost);
    }

    function formatBeroas(b) {
        if (b === null) return 'N/A';
        if (!isFinite(b)) return '∞';
        return b.toFixed(2);
    }

    function formatCurrency(v) {
        if (v === null || !isFinite(v)) return '—';
        return new Intl.NumberFormat('es-ES', {
            style: 'currency', currency: 'EUR',
            minimumFractionDigits: 0, maximumFractionDigits: 2
        }).format(v);
    }

    function generateAxis(base, count, minPct, maxPct) {
        const values = [];
        const step = (maxPct - minPct) / (count - 1);
        for (let i = 0; i < count; i++) {
            const pct = minPct + step * i;
            values.push(Math.max(0, Math.round(base * (1 + pct / 100) * 100) / 100));
        }
        return values;
    }

    function applyHeroTone(b) {
        const el = document.getElementById('copyfy-beroas-hero-value');
        el.classList.remove('copyfy-beroas-hero-value-good', 'copyfy-beroas-hero-value-bad');
        if (b === null) { el.classList.add('copyfy-beroas-hero-value-bad'); return; }
        if (b <= state.targetBeroas) el.classList.add('copyfy-beroas-hero-value-good');
        else el.classList.add('copyfy-beroas-hero-value-bad');
    }

    function applyBadge(b) {
        const badge = document.getElementById('copyfy-beroas-badge');
        const text = document.getElementById('copyfy-beroas-badge-text');

        ['copyfy-beroas-badge-good', 'copyfy-beroas-badge-tight', 'copyfy-beroas-badge-bad']
            .forEach(c => badge.classList.remove(c));

        if (b === null) {
            badge.classList.add('copyfy-beroas-badge-bad');
            text.textContent = 'Margen negativo';
        } else if (b <= state.targetBeroas) {
            badge.classList.add('copyfy-beroas-badge-good');
            text.textContent = 'Bajo el objetivo';
        } else if (b <= state.targetBeroas * 1.1) {
            badge.classList.add('copyfy-beroas-badge-tight');
            text.textContent = 'Margen ajustado';
        } else {
            badge.classList.add('copyfy-beroas-badge-bad');
            text.textContent = 'Por encima del objetivo';
        }
    }

    function applyInterp(b) {
        const interp = document.getElementById('copyfy-beroas-interp');
        const text = document.getElementById('copyfy-beroas-interp-text');
        interp.classList.remove('copyfy-beroas-interp-loss');

        if (b === null) {
            interp.classList.add('copyfy-beroas-interp-loss');
            text.innerHTML = 'Tu margen es negativo: con este precio de venta y estos costes, pierdes dinero <strong>antes incluso de gastar en publicidad</strong>. Sube el precio o reduce los costes.';
            return;
        }

        const formatted = formatBeroas(b);
        const compare = b <= state.targetBeroas
            ? `Estás <strong>por debajo de tu objetivo</strong> de ${formatBeroas(state.targetBeroas)} — margen cómodo.`
            : `Estás <strong>por encima de tu objetivo</strong> de ${formatBeroas(state.targetBeroas)} — necesitas un ROAS más alto para mantener la rentabilidad.`;

        text.innerHTML = `Necesitas alcanzar un ROAS mínimo de <strong>${formatted}</strong> para alcanzar el equilibrio. Cada euro gastado en publicidad debe generar al menos <strong>${formatted}€</strong> de ingresos. ${compare}`;
    }

    function updateResult() {
        const b = calculateBeroas(state.sellingPrice, state.productCost);

        document.getElementById('copyfy-beroas-hero-value').textContent = formatBeroas(b);
        applyHeroTone(b);
        applyBadge(b);
        applyInterp(b);

        saveState();
        renderMatrix();
    }

    function renderMatrix() {
        const w = window.innerWidth;
        const gridSize = w < 640 ? 6 : w < 1024 ? 8 : 10;
        const priceAxis = generateAxis(state.sellingPrice, gridSize, -50, 50);
        const costAxis = generateAxis(state.productCost, gridSize, -50, 100);

        const container = document.getElementById('copyfy-beroas-matrix');
        container.innerHTML = '';

        // Y-axis vertical label
        const yLabel = document.createElement('div');
        yLabel.className = 'copyfy-beroas-matrix-y-label';
        yLabel.textContent = 'Precio de venta';
        container.appendChild(yLabel);

        // Y-axis values
        const yAxis = document.createElement('div');
        yAxis.className = 'copyfy-beroas-matrix-y-axis';
        priceAxis.forEach(price => {
            const v = document.createElement('div');
            v.className = 'copyfy-beroas-matrix-y-value';
            if (Math.abs(price - state.sellingPrice) < 0.01) {
                v.className += ' copyfy-beroas-matrix-y-value-current';
            }
            v.textContent = formatCurrency(price);
            yAxis.appendChild(v);
        });
        container.appendChild(yAxis);

        // Grid + X-axis wrapper
        const wrap = document.createElement('div');
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.flex = '1 1 0';
        wrap.style.minWidth = '0';
        wrap.style.marginLeft = '6px';

        const grid = document.createElement('div');
        grid.className = 'copyfy-beroas-matrix-grid';

        priceAxis.forEach(price => {
            const row = document.createElement('div');
            row.className = 'copyfy-beroas-matrix-row';

            costAxis.forEach(cost => {
                const b = calculateBeroas(price, cost);
                const isCurrent =
                    Math.abs(price - state.sellingPrice) < 0.01 &&
                    Math.abs(cost - state.productCost) < 0.01;
                const isAbove = b !== null && b > state.targetBeroas;

                const cell = document.createElement('div');
                cell.className = 'copyfy-beroas-matrix-cell';

                if (b === null) cell.className += ' copyfy-beroas-cell-invalid';
                else if (isCurrent) cell.className += ' copyfy-beroas-cell-current';
                else if (isAbove) cell.className += ' copyfy-beroas-cell-above';
                else cell.className += ' copyfy-beroas-cell-below';

                cell.textContent = formatBeroas(b);
                cell.title = `Precio: ${formatCurrency(price)} · Coste: ${formatCurrency(cost)} · BEROAS: ${formatBeroas(b)}`;

                cell.addEventListener('click', () => {
                    state.sellingPrice = price;
                    state.productCost = cost;
                    document.getElementById('copyfy-beroas-selling-price').value = price;
                    document.getElementById('copyfy-beroas-product-cost').value = cost;
                    updateResult();
                });

                row.appendChild(cell);
            });

            grid.appendChild(row);
        });

        wrap.appendChild(grid);

        // X-axis values
        const xAxis = document.createElement('div');
        xAxis.className = 'copyfy-beroas-matrix-x-axis';
        costAxis.forEach(cost => {
            const v = document.createElement('div');
            v.className = 'copyfy-beroas-matrix-x-value';
            if (Math.abs(cost - state.productCost) < 0.01) {
                v.className += ' copyfy-beroas-matrix-x-value-current';
            }
            v.textContent = formatCurrency(cost);
            xAxis.appendChild(v);
        });
        wrap.appendChild(xAxis);

        // X-axis label
        const xLabel = document.createElement('div');
        xLabel.className = 'copyfy-beroas-matrix-x-label';
        xLabel.textContent = 'Coste del producto';
        wrap.appendChild(xLabel);

        container.appendChild(wrap);
    }

    function init() {
        loadState();

        Object.entries(FIELDS).forEach(([id, [key, parser]]) => {
            const el = document.getElementById(id);
            el.value = state[key];
            el.addEventListener('input', (e) => {
                state[key] = parser(e.target.value);
                updateResult();
            });
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderMatrix, 200);
        });

        updateResult();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<script>
(function(){
  function ph(){ try{ parent.postMessage({copyfyToolHeight: Math.ceil((document.querySelector(".copyfy-beroas,.copyfy-dpm")||document.body).getBoundingClientRect().bottom)}, "*"); }catch(e){} }
  window.addEventListener("load", ph);
  window.addEventListener("resize", ph);
  document.addEventListener("input", ph, true);
  if(window.ResizeObserver){ new ResizeObserver(ph).observe(document.documentElement); }
  setTimeout(ph,200); setTimeout(ph,800);
})();
</script>
